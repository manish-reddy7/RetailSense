[project]
name = "retailsense"
version = "0.1.0"
description = "Disagreement-triggered multi-agent demand forecasting and restocking (capstone)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pyyaml>=6",
    "openmeteo-requests>=1.2",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "holidays>=0.50",
    "scipy>=1.12",
    "mlflow>=2.12",
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7"]
posthoc = [  # eval/posthoc.py only: learner comparison, foundation-model baseline
    "xgboost>=3.0",
    "torch>=2.14",
    "chronos-forecasting>=2.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the raw India files in data/raw/india/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
