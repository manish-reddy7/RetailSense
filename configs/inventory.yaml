# Inventory policy and simulator parameters (blueprint 8.2).
lead_time: 3
coverage: 7
service_level: 0.95
z_table: {0.90: 1.28, 0.95: 1.65, 0.99: 2.33}
band_to_sigma: 2.563    # (upper - lower) / 2.563 = sigma for a 10-90% band
holding_rate: 0.25      # of price per year
days_per_year: 365
order_cost: 5.0
lost_sales_mult: 1.0
case_pack: 6
naive_band_days: 364    # seasonal-naive band = 10-90% of its errors over the last 364 train days
sensitivity:            # one-at-a-time around the defaults above (blueprint 8.2)
  lead_time: [1, 3, 7]
  service_level: [0.90, 0.95, 0.99]
  holding_rate: [0.15, 0.25, 0.35]
  order_cost: [2.0, 5.0, 10.0]
  lost_sales_mult: [0.5, 1.0, 2.0]
