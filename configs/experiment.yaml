# RetailSense experiment config: India kirana store MUM_1 (data generated by configs/india_generator.yaml).
dataset: india
seed: 42

paths:
  raw: data/raw/india
  processed: data/processed/india
  cache: data/cache
  db: data/retailsense.db
  subset: configs/subset.yaml

data:
  store: MUM_1
  state: MH
  dept: KIRANA
  top_n: 60            # all items: the data has few zeros, and the small festival items carry the planted signal
  rank_end: d_1799      # items are ranked on train days only, so test sales cannot pick the subset
  train_end: d_1799
  val_end: d_1885
  test_end: d_1941

weather:
  # Real Open-Meteo archive weather for each store's city; demand responds to it.
  city: {MH: [19.08, 72.88], DL: [28.61, 77.21], TN: [13.08, 80.27]}  # Mumbai, Delhi, Chennai
  vars: [temperature_2m_max, temperature_2m_min, precipitation_sum]
  timezone: Asia/Kolkata
  fetch_start: "2009-01-01"   # ten earlier years for the past-years-only climatology
  fetch_end: "2024-04-29"
  clim_years: 10              # climatology = same-season days in the previous 10 years
  clim_half_window: 15        # +-15 days around the day of year = 30-day window
  hot_anom_c: 5.0             # hot day: tmax >= climatology + 5 C
  rainy_mm: 1.0               # rainy day: precipitation >= 1 mm
  change_days: 3

interest:
  trends_dir: data/raw/india/trends
  trends_geo: IN-MH
  keywords:                   # search term -> feature name
    ice cream: ice_cream
    cold drink: cold_drink
    tea: tea
    sweets: sweets
    dry fruits: dry_fruits
    maggi: maggi
  trends_lt1: 0.5

agents:
  horizons: [1, 2, 3, 4, 5, 6, 7]
  confidence_window: 28
  confidence_min_days: 14
  oof_folds: 5

disagreement: {method: cv, floor: 1.0, tau_quantile: 0.80}

analysis:                   # H1 analysis on validation (blueprint 7.2)
  worst_share: 0.20         # "worst errors" = top 20% of relative consensus error
  bootstrap: 1000           # resamples over items for confidence intervals
  trigger_rates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]

deliberation:
  rounds: 1
  m_bounds: [0.25, 2.0]
  provider: ollama           # ollama (local) | openrouter | google
  model: llama3.1:latest    # local Ollama, 8B; the reported model is logged per call
  api_key_env: OPENROUTER_API_KEY
  temperature: 0
  max_output_tokens: 2048  # answers are ~250 tokens; caps what each request reserves
  context_tokens: 3072     # Ollama context window (prompts are ~1,200 tokens)
  prompt_version: v1        # FROZEN 2026-10-01
  history_days: 14          # recent revealed sales shown to the critic (blueprint 7.4)
  max_invalid_retries: 1    # invalid JSON -> one retry -> fall back to fast consensus
  api_retries: 6            # transient API errors (429 / 5xx), exponential backoff
  api_backoff_s: 2.0
  rpm: 300                  # client-side requests/minute
  sample_size: 1500         # stratified validation sample for the LLM arms (blueprint 7.7)
  random_trigger_draws: 50  # random-trigger arm averaged over this many draws
  workers: 4                # 4 cases at once; Ollama batches them (OLLAMA_NUM_PARALLEL=4)
  tau: 0.076898                # FROZEN 2026-10-01 (q-tau_quantile of validation D); never change

lgbm:
  num_threads: 4
  early_stop_days: 28   # early stopping on the last 28 days of each training set, then refit on all of it
  early_stopping_rounds: 100
  max_rounds: 3000
  quantiles: [0.1, 0.9]
  historical:
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    tweedie_variance_power: 1.1
  residual:             # context agents: heavy shrinkage so weak evidence gives small adjustments
    learning_rate: 0.03
    num_leaves: 15
    min_data_in_leaf: 1000
    feature_fraction: 1.0
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 50.0
  key_factors: 3

ets:
  season: 7
  fit_window: 364       # days of history each weekly refit sees
  refit_every: 7
  band_alpha: 0.2       # 10-90% interval

mlflow:
  tracking_uri: sqlite:///mlflow.db

final:                      # Phase 5a (blueprint 9.4-9.5); read only by eval/final.py
  # Rolling-origin backtest: three 56-day windows before validation. Each refits every model on
  # days before its window, so no window sees its own sales or the validation/test split.
  backtest_windows: [[d_1632, d_1687], [d_1688, d_1743], [d_1744, d_1799]]
  fixed_tau: 0.3            # ablation: an uncalibrated threshold (blueprint 9.5 example)
  weather_noise_sd: 1.0     # ablation: Gaussian noise on continuous weather inputs, in feature SDs
  curve_step: 0.1           # cost-accuracy curve: trigger rates 0, 0.1, ..., 1
  curve_draws: 5            # random-trigger draws per rate for the inventory-cost curve
  lead_times: [1, 3, 7]     # ablation: does the benefit grow with lead time?
